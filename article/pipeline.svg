<svg xmlns="http://www.w3.org/2000/svg" width="440" viewBox="0 0 440 506" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
<title>The 3rd-shot pipeline in six steps, from broadcast video to the shot model</title>
<rect x="50" y="8" width="340" height="54" rx="3" fill="#f1efe7" stroke="#cfcbbd"/>
<text x="220" y="31" text-anchor="middle" font-size="15" font-weight="600" fill="#141413">Broadcast video</text>
<text x="220" y="50" text-anchor="middle" font-size="13" fill="#5c5b56">One fixed camera</text>
<path d="M220 67V85M215 79L220 85L225 79" fill="none" stroke="#9a9891" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="50" y="90" width="340" height="54" rx="3" fill="#f1efe7" stroke="#cfcbbd"/>
<text x="220" y="113" text-anchor="middle" font-size="15" font-weight="600" fill="#141413">Court calibration</text>
<text x="220" y="132" text-anchor="middle" font-size="13" fill="#5c5b56">Pixels become court feet</text>
<path d="M220 149V167M215 161L220 167L225 161" fill="none" stroke="#9a9891" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="50" y="172" width="340" height="54" rx="3" fill="#f1efe7" stroke="#cfcbbd"/>
<text x="220" y="195" text-anchor="middle" font-size="15" font-weight="600" fill="#141413">Players, ball and sound</text>
<text x="220" y="214" text-anchor="middle" font-size="13" fill="#5c5b56">Tracked in 2D</text>
<path d="M220 231V249M215 243L220 249L225 243" fill="none" stroke="#9a9891" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="50" y="254" width="340" height="54" rx="3" fill="#f1efe7" stroke="#cfcbbd"/>
<text x="220" y="277" text-anchor="middle" font-size="15" font-weight="600" fill="#141413">Hits and bounces</text>
<text x="220" y="296" text-anchor="middle" font-size="13" fill="#5c5b56">Decoded from all three</text>
<path d="M220 313V331M215 325L220 331L225 325" fill="none" stroke="#9a9891" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="50" y="336" width="340" height="54" rx="3" fill="#f6e3da" stroke="#c2613f"/>
<text x="220" y="359" text-anchor="middle" font-size="15" font-weight="600" fill="#141413">3D scene</text>
<text x="220" y="378" text-anchor="middle" font-size="13" fill="#5c5b56">Ball, bodies and paddles</text>
<path d="M220 395V413M215 407L220 413L225 407" fill="none" stroke="#9a9891" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="50" y="418" width="340" height="54" rx="3" fill="#f6e3da" stroke="#c2613f"/>
<text x="220" y="441" text-anchor="middle" font-size="15" font-weight="600" fill="#141413">Shot table and model</text>
<text x="220" y="460" text-anchor="middle" font-size="13" fill="#5c5b56">Where the ball goes next</text>
<rect x="50" y="484" width="12" height="12" rx="2" fill="#f1efe7" stroke="#cfcbbd"/><text x="70" y="494" font-size="13" fill="#5c5b56">Measured from the video</text>
<rect x="230" y="484" width="12" height="12" rx="2" fill="#f6e3da" stroke="#c2613f"/><text x="250" y="494" font-size="13" fill="#5c5b56">Built from those</text>
</svg>
